[pytest]
# only the files with prefix `pytest_` would be recognized as pytest test scripts.
python_files = pytest_*.py

# Do not collect pytest_*.py shipped inside component manager checkouts
# (e.g. usb_host_uac/test_app), which are not built by this repo's CI.
norecursedirs = managed_components

# Match esp-adf-internal: show DUT/serial output in CI job logs when tests pass.
# Keep esptool flash baud at 115200: default 921600 is unstable on some ESP32-P4
# USB-Serial/JTAG runners (IDF v6.1). pytest-embedded-idf honors ESPBAUD env;
# --esptool-baud alone is not enough for the idf flash path.
addopts =
  -s
  --embedded-services esp,idf
  --esptool-baud 115200
  --tb short

# ignore PytestExperimentalApiWarning for record_xml_attribute
filterwarnings =
  ignore::_pytest.warning_types.PytestExperimentalApiWarning

# log related
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# junit related
junit_family = xunit1
junit_logging = stdout
junit_log_passing_tests = False

markers =
  UT_T1_AUDIO: audio unit-test runner / env marker
  esp32: target esp32
  esp32s3: target esp32s3
  esp32c3: target esp32c3
  esp32p4: target esp32p4
  esp32s31: target esp32s31
