include:
  - '.gitlab/ci/common.yml'

component_test_esp32:
  extends:
    - .rules:build:enable-unit-test-static
    - .build_component_test_template
    - .matrix_template_with_master
  variables:
    IDF_TARGET: esp32
    BOARD: ESP_LYRAT_MINI_V1_1
    DEEP_CLONE: "false"

component_test_esp32s3:
  extends:
    - .rules:build:enable-unit-test-static
    - .build_component_test_template
    - .matrix_template_with_master
  variables:
    IDF_TARGET: esp32s3
    BOARD: ESP32_S3_KORVO2_V3
    DEEP_CLONE: "false"

component_test_esp32p4:
  extends:
    - .rules:build:enable-unit-test-static
    - .build_component_test_template
    - .matrix_template_v5_5_with_master
  variables:
    IDF_TARGET: esp32p4
    BOARD: ESP32_P4_FUNCTION_EV
    DEEP_CLONE: "false"

component_test_esp32c3:
  extends:
    - .rules:build:enable-unit-test-static
    - .build_component_test_template
    - .matrix_template_with_master
  variables:
    IDF_TARGET: esp32c3
    BOARD: ESP32_C3_LYRA_V2
    DEEP_CLONE: "false"

component_test_esp32s31:
  extends:
    - .rules:build:enable-unit-test-static
    - .build_component_test_template
    - .matrix_template_v6_1
  variables:
    IDF_TARGET: esp32s31
    BOARD: ESP32_S31_KORVO_V1
    DEEP_CLONE: "false"
