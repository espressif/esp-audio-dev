# The file marks apps with exceptional build or test rules. Apps not listed here
# are enabled by default.
#
# Notes for esp_bool_parser used by idf-build-apps:
#   - Boolean operators must be lower-case: 'and', 'or', 'not'.
#   - Only built-in variables are recognised in expressions: IDF_TARGET,
#     IDF_VERSION_MAJOR/MINOR/PATCH, INCLUDE_DEFAULT, CONFIG_NAME.
#   - A path key may point to one app or to a parent directory. Parent rules
#     apply to all apps below that directory.
#
# This standalone repository currently has no per-app exceptions. Keep the common
# anchors below so future rules can be added without changing file structure.

.if_all: &if_all {if: 'IDF_VERSION_MAJOR >= 0'}

.if_esp32:   &if_esp32   {if: 'IDF_TARGET == "esp32"'}
.if_esp32s3: &if_esp32s3 {if: 'IDF_TARGET == "esp32s3"'}
.if_esp32c3: &if_esp32c3 {if: 'IDF_TARGET == "esp32c3"'}
.if_esp32p4: &if_esp32p4 {if: 'IDF_TARGET == "esp32p4"'}
.if_esp32s31: &if_esp32s31 {if: 'IDF_TARGET == "esp32s31"'}

.if_idf_v5_4: &if_idf_v5_4 {if: 'IDF_VERSION_MAJOR == 5 and IDF_VERSION_MINOR == 4'}
.if_idf_v5_5: &if_idf_v5_5 {if: 'IDF_VERSION_MAJOR == 5 and IDF_VERSION_MINOR == 5'}
.if_idf_v6_0: &if_idf_v6_0 {if: 'IDF_VERSION_MAJOR == 6 and IDF_VERSION_MINOR == 0'}
.if_idf_v6_1: &if_idf_v6_1 {if: 'IDF_VERSION_MAJOR == 6 and IDF_VERSION_MINOR == 1'}
# Branch refs such as master carry no tag version; CI passes the version.cmake version instead
# (see _ci_apps_idf_version in tools/ci/utils.sh), so match them by their numeric version.
.if_idf_v6_2: &if_idf_v6_2 {if: 'IDF_VERSION_MAJOR == 6 and IDF_VERSION_MINOR == 2'}
